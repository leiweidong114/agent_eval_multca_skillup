id: smart-street-light-e2e
title: Smart street light complete schematic pipeline evaluation
description: Generates and verifies a small catalog-backed smart street light controller through all four Skills.
input:
  prompt: |
    强制前置门禁：先只检查当前评测 workspace 已安装的 Skill，不得递归搜索盘符、用户目录、JustDo 安装目录或工作区外路径。如果当前 workspace 没有 schematic-pipeline、signal-interface-generation、schematic-layout-codegen、schematic-web-apply，立即只回复 SCHEMATIC_SKILL_UNAVAILABLE 并停止；这是无 Skill 基线的预期行为。

    生成一个智能路灯控制器的简易电气原理图，不要生成流程图、框图、Mermaid 或 Figma/FigJam 图。
    使用器件库中实际存在的 ESP32-S3-WROOM-1 作为主控，以两个普通电阻组成环境光检测分压等效输入，使用 GPIO、基极电阻、NPN 三极管和 LED 表示低端路灯负载驱动，并包含输入保险丝、齐纳保护和必要的电源/地网络。只使用 catalog.json 中存在的 library_id 和真实引脚号。电气连接必须表达：3V3→分压上臂电阻→LIGHT_SENSE→分压下臂电阻→GND，且 LIGHT_SENSE 使用 ESP32 的 4 号引脚；ESP32 的 5 号引脚→GPIO_DRIVE→基极电阻→Q_BASE→Q1.B；3V3→LED.A，LED.K→Q1.C，Q1.E→GND；VCC_IN→保险丝→3V3，齐纳管 K 接 3V3、A 接 GND。不能把基极电阻接到集电极网络，也不能让任何外围器件引脚悬空。

    必须按顺序完成四阶段流程：schematic-pipeline、signal-interface-generation、schematic-layout-codegen、schematic-web-apply。先调用已安装的 bundle Skill，再按照 bundle 顶层 SKILL.md 列出的精确相对路径读取四个 SKILL.md；子 Skill 是 bundle 内文件，不是额外安装的 Skill 工具。禁止调用 Figma、Mermaid 或通用画图工具替代电气原理图流水线。
    当前 Windows shell 是 PowerShell，不要使用 ls -la、find、head 或 mkdir -p。从 workspace 根目录执行命令，脚本使用 bundle 内的绝对路径。先检查 http://127.0.0.1:8631/api/health，再真实运行 fetch_catalog.py 生成 out/catalog.json；只用一次 query_catalog.py 调用，分别传入精确的 --library-id RF_Module:ESP32-S3-WROOM-1、Device:R、Transistor_BJT:Q_NPN_CBE、Device:LED、Device:Fuse、Device:D_Zener，齐纳器件必须使用 Device:D_Zener，不能用 LED 代替。写 JSON 前必须读取 signal-interface-generation/references/sheet_schema.md。只允许模型编写 out/sheets.json，字段必须使用：sheet_id；main_chip={instance,library_id}；components[].{instance,library_id,value,pins,group,is_main}；nets[].{name,type,priority,pins:[{instance,pin}]}，禁止 id/ref/connections 格式。validate_sheets.py 非 0 时只能修正并重验，禁止进入后续阶段。校验后用 render_sheets_markdown.py 生成 sheets_markdown，再用 codegen_base.py 生成切片；直接使用它输出的精简摘要，不要打印完整 base.txt/slices.json。连接代码切片必须由 spawn_agent subagent 完成，每批最多并行两个；Codex 子任务用 fork_context=false，`message` 正文必须写出具体 `slice_id=<ID>`（不能只放在 target 字段），只读绝对路径，并在 FRAGMENT_BEGIN/FRAGMENT_END 之间只返回该切片网络；数字开头的 `3V3` 网络必须写为 `circuit.__getattr__("3V3")`。用 120 秒等待直至每个子任务完成，主 Agent 仅把返回区间原样落盘，不得自行生成或修改。随后真实运行 layout_sheet.py 生成 out/layout/S1.json；该脚本必须通过切片网络和端点精确校验，且 overlap=0、unrouted=0；最后真实运行 apply.py 生成 out/apply_result.json 并验证其中 URL 可访问。
    禁止手写 catalog、布局、apply_result 或虚构 URL/指标；任何脚本、subagent 或 URL 验证失败都必须报告失败。
    最终回复必须原样包含以下四行，然后再列出 Subagent 运行情况、所有关键产物路径、布局指标和网页 URL：
    schematic-pipeline: used
    signal-interface-generation: used
    schematic-layout-codegen: used
    schematic-web-apply: used
    任一阶段失败时必须明确返回失败，不得用其他类型的图冒充成功。
constraints:
  timeout_seconds: 3600
  max_turns: 30
expect:
  exit_code: 0
  files_exist:
    - out/catalog.json
    - out/sheets.json
    - out/sheets_markdown
    - out/frags
    - out/layout/S1.json
    - out/apply_result.json
  file_contains:
    - path: out/sheets.json
      content: ESP32-S3-WROOM-1
    - path: out/sheets.json
      content: Device:D_Zener
    - path: out/sheets.json
      content: Q_BASE
    - path: out/layout/S1.json
      content: component_overlap_count
    - path: out/layout/S1.json
      content: unrouted_net_count
    - path: out/apply_result.json
      content: url
    - path: out/apply_result.json
      content: url_verification
  must_contain:
    - schematic-pipeline
    - signal-interface-generation
    - schematic-layout-codegen
    - schematic-web-apply
    - out/apply_result.json
  must_not_contain:
    - mermaid
    - figma.com
judge:
  type: rule_based
  success:
    - exit_code: 0
    - files_exist:
        - out/catalog.json
        - out/sheets.json
        - out/layout/S1.json
        - out/apply_result.json
