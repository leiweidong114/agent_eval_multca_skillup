[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-multica-skillup"
version = "0.1.0"
description = "Local, login-free Agent Skill evaluation with skill-up and Multica runtimes"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "python-multipart>=0.0.9,<1"]
database = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
