# Copy this file to local.yaml. local.yaml is ignored by Git.
secrets:
  LITELLM_API_KEY: sk-your-virtual-key
  # Required for exact per-task correlation and hard model verification.
  LITELLM_MASTER_KEY: sk-your-litellm-master-key
  LITELLM_DATABASE_PASSWORD: your-database-password

# The LiteLLM API and PostgreSQL can use the same intranet host.
default_profile: intranet_default
profiles:
  intranet_default:
    model: your-litellm-model-name
    api_base: http://10.0.0.10:4000/v1
    api_key_env: LITELLM_API_KEY
database:
  host: 10.0.0.10
  port: 5432

# Agent installations remain external to this project.
agents:
  codex:
    executable: C:\Tools\codex\codex.exe

# Optional scoring and judge override. The committed scoring defaults fail
# open to deterministic rules when the judge is unavailable.
# scoring:
#   dimensions:
#     result: {weight: 0.5, rule_weight: 0.6, llm_weight: 0.4}
#   llm_judge:
#     enabled: true
#     required: false
#     profile: intranet_default
#     model: your-litellm-model-name
